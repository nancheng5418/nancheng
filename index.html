<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0805">
<title>南城导航首页</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='11' fill='%23d97706'/%3E%3Cpolygon points='10 8 16 12 10 16 10 8' fill='white'/%3E%3C/svg%3E">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --card-bg: rgba(18, 16, 14, 0.55);
    --card-border: rgba(255, 255, 255, 0.10);
    --pill-bg: rgba(18, 16, 14, 0.65);
    --text: #f5f1ea;
    --text-dim: rgba(245, 241, 234, 0.65);
    --accent: #e8a04b;
  }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    color: var(--text);
    background: #0a0805;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }
  .bg {
    position: fixed; inset: 0;
    background-image: url("https://media.doubao.com/space/api/box/stream/download/all_by_mount_point/FHTGb0gzqoJCfHxO8QzcLMwwngg");
    background-size: cover; background-position: center;
    z-index: -2;
  }
  .bg::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.45) 40%, rgba(0,0,0,0.78) 100%);
  }
  .wrap {
    max-width: 480px; margin: 0 auto;
    padding: env(safe-area-inset-top) 18px calc(env(safe-area-inset-bottom) + 28px);
    min-height: 100vh; display: flex; flex-direction: column;
  }
  .topbar { display: flex; align-items: center; gap: 10px; padding-top: 18px; margin-bottom: 14px; }
  .topbar h1 { flex: 1; font-size: 20px; font-weight: 700; text-align: center; letter-spacing: 0.5px; }
  .iconbtn {
    min-width: 40px; height: 40px; border-radius: 12px;
    border: 1px solid var(--card-border);
    background: var(--pill-bg);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    color: var(--text); display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0; transition: transform 0.15s; text-decoration: none;
  }
  .iconbtn:active { transform: scale(0.92); }
  .iconbtn svg { width: 20px; height: 20px; }
  .iconbtn.pill-text { padding: 0 14px; font-size: 13px; gap: 6px; }
  .search {
    display: flex; align-items: center; gap: 10px;
    background: var(--pill-bg); border: 1px solid var(--card-border);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-radius: 14px; padding: 11px 16px; margin-bottom: 12px;
  }
  .search svg { width: 18px; height: 18px; opacity: 0.7; flex-shrink: 0; }
  .search input { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-size: 15px; }
  .search input::placeholder { color: var(--text-dim); }
  .notice {
    display: flex; align-items: flex-start; gap: 9px;
    background: rgba(232, 160, 75, 0.12);
    border: 1px solid rgba(232, 160, 75, 0.3);
    border-radius: 12px; padding: 10px 13px; margin-bottom: 14px;
    font-size: 12px; line-height: 1.5; color: rgba(245, 241, 234, 0.85);
  }
  .notice svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 1px; color: var(--accent); }
  .meta { display: flex; align-items: center; gap: 8px; margin-bottom: 22px; }
  .status {
    flex: 1; display: flex; align-items: center; gap: 7px;
    background: var(--pill-bg); border: 1px solid var(--card-border);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-radius: 999px; padding: 9px 14px; font-size: 12px;
    color: var(--text-dim); white-space: nowrap;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 8px rgba(34,197,94,0.7); }
  .section-title {
    font-size: 18px; font-weight: 700; margin: 6px 0 12px;
    padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.12);
  }
  .grid { display: grid; gap: 11px; }
  .g2 { grid-template-columns: repeat(2, 1fr); }
  .g3 { grid-template-columns: repeat(3, 1fr); }
  .card {
    position: relative; display: flex; flex-direction: column; align-items: center; gap: 9px;
    background: var(--card-bg); border: 1px solid var(--card-border);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-radius: 16px; padding: 14px 8px 12px;
    text-decoration: none; color: var(--text);
    transition: transform 0.15s, background 0.15s;
  }
  .card:active { transform: scale(0.95); background: rgba(40,36,32,0.65); }
  .icon {
    width: 54px; height: 54px; border-radius: 14px;
    background: rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .icon svg { width: 28px; height: 28px; }
  .cat-card .icon { width: 64px; height: 64px; border-radius: 16px; }
  .cat-card .icon svg { width: 32px; height: 32px; }
  .label { font-size: 12.5px; text-align: center; line-height: 1.25; color: var(--text); }
  .empty { text-align: center; color: var(--text-dim); padding: 40px 0; font-size: 14px; }
  footer { margin-top: auto; text-align: center; color: rgba(255,255,255,0.35); font-size: 11px; padding-top: 24px; }
  .toast {
    position: fixed; left: 50%; bottom: 80px;
    transform: translateX(-50%) translateY(20px);
    background: rgba(0,0,0,0.85); color: #fff; padding: 10px 20px;
    border-radius: 999px; font-size: 13px; opacity: 0; pointer-events: none;
    transition: opacity 0.25s, transform 0.25s; z-index: 99;
    backdrop-filter: blur(10px); white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .donate-fab {
    position: fixed; right: 16px; bottom: 100px; z-index: 50;
    background: linear-gradient(135deg, #f59e0b, #d97706);
    color: #fff; border: none; border-radius: 999px;
    padding: 12px 18px; font-size: 13px; font-weight: 600;
    box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
    cursor: grab; user-select: none; -webkit-user-select: none; touch-action: none;
    display: flex; align-items: center; gap: 6px;
  }
  .donate-fab:active { cursor: grabbing; }
  .donate-fab svg { width: 16px; height: 16px; }
  .modal-mask {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    z-index: 100; display: none; align-items: center; justify-content: center; padding: 24px;
  }
  .modal-mask.show { display: flex; }
  .modal-box {
    background: #1a1714; border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px; padding: 24px 20px 20px;
    max-width: 340px; width: 100%; text-align: center; position: relative;
  }
  .modal-close {
    position: absolute; top: 10px; right: 10px;
    width: 30px; height: 30px; border-radius: 50%; border: none;
    background: rgba(255,255,255,0.1); color: #fff; font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-box h3 { font-size: 16px; margin-bottom: 14px; color: var(--text); }
  .modal-box img { width: 100%; border-radius: 12px; margin-bottom: 16px; display: block; }
  .modal-download {
    display: block; width: 100%;
    background: linear-gradient(135deg, #f59e0b, #d97706);
    color: #fff; border: none; border-radius: 12px; padding: 12px;
    font-size: 14px; font-weight: 600; text-decoration: none; cursor: pointer;
  }
</style>
</head>
<body>

<div class="bg"></div>

<div class="wrap">
  <div class="topbar">
    <button class="iconbtn" id="backBtn" style="visibility:hidden">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <h1 id="pageTitle">我的导航站</h1>
  </div>

  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="7"/>
      <line x1="21" y1="21" x2="16.5" y2="16.5"/>
    </svg>
    <input id="searchInput" type="text" placeholder="南城导航页®" autocomplete="off">
  </div>

  <div class="notice" id="homeNotice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 11l18-7v16L3 13v-2z"/>
      <path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>
    </svg>
    <div>本站内容由管理员维护，<b>普通访客无法编辑</b>。如需修改，请联系管理员。</div>
  </div>

  <div class="meta" id="homeMeta">
    <div class="status"><span class="dot"></span><span>在线</span><span class="dot" style="margin-left:6px"></span><span>延迟: <b id="latency">--</b>ms</span></div>
    <a class="iconbtn pill-text" href="https://qm.qq.com/q/PFf8o7a1uo" target="_blank" rel="noopener">QQ客服</a>
    <button class="iconbtn pill-text" id="shareBtn">分享</button>
  </div>

  <main id="main"></main>

  <footer>南城账号</footer>
</div>

<div class="toast" id="toast"></div>

<div class="modal-mask" id="donateModal">
  <div class="modal-box">
    <button class="modal-close" id="donateClose">×</button>
    <h3>赞赏作者</h3>
    <img id="donateImg" src="https://media.doubao.com/space/api/box/stream/download/all_by_mount_point/ADB6b6ypkoW5LmxKyiLcF0mvnsb" alt="赞赏码">
    <a class="modal-download" id="donateDownload" href="https://media.doubao.com/space/api/box/stream/download/all_by_mount_point/ADB6b6ypkoW5LmxKyiLcF0mvnsb" download="赞赏码.jpg">下载赞赏码</a>
  </div>
</div>

<button class="donate-fab" id="donateFab">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
  </svg>
  赞赏作者
</button>

<script>
const DEFAULT_ICONS = [
  '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M3 11h18"/><path d="M8 15h3"/>',
  '<path d="M4 14v-3a8 8 0 0 1 16 0v3"/><rect x="2.5" y="13" width="4" height="6" rx="1.5"/><rect x="17.5" y="13" width="4" height="6" rx="1.5"/>',
  '<path d="M17.5 19a4.5 4.5 0 0 0 .4-8.98A6 6 0 0 0 6.6 9.1 4 4 0 0 0 7 17"/><line x1="12" y1="12" x2="12" y2="18"/><polyline points="9 15 12 12 15 15"/>',
  '<polyline points="4 5 10 5 10 19"/><line x1="7" y1="5" x2="7" y2="19"/><path d="M14 15l4-10 4 10"/><line x1="15.5" y1="11.5" x2="18.5" y2="11.5"/>',
  '<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/>',
  '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><line x1="14" y1="14" x2="14" y2="21"/><line x1="18" y1="14" x2="21" y2="14"/><line x1="21" y1="18" x2="21" y2="21"/>',
  '<polygon points="10 8 16 12 10 16 10 8" fill="white" stroke="none"/><circle cx="12" cy="12" r="9"/>',
  '<path d="M3 7a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>'
];

// ★★★ 在这里改你的分类和链接 ★★★
const CATS = [
  {
    name: "常用服务",
    iconIdx: 0,
    links: [
      { name: "何平小号卡网", url: "https://007fk.oeisp.cn/shop/nanc", iconIdx: 0 },
      { name: "PUBG八级号卡网", url: "https://new.818fka.com/shop/nanc", iconIdx: 0 },
      { name: "卡网",     url: "https://example.com", iconIdx: 0 },
      { name: "售后客服", url: "https://example.com", iconIdx: 1 }
    ]
  },
  {
    name: "使用教程",
    iconIdx: 3,
    links: [
      { name: "改语言教学", url: "https://example.com", iconIdx: 3 },
      { name: "清理教学",   url: "https://example.com", iconIdx: 4 },
      { name: "扫码教学",   url: "https://example.com", iconIdx: 5 },
      { name: "视频教程",   url: "https://example.com", iconIdx: 6 }
    ]
  }
];

function iconSVG(idx) {
  const p = DEFAULT_ICONS[(idx || 0) % DEFAULT_ICONS.length];
  return `<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
}

function parseHash() {
  const h = location.hash.replace(/^#\/?/, '');
  if (h.startsWith('cat/')) return { page: 'cat', idx: parseInt(h.slice(4), 10) };
  return { page: 'home' };
}

let search = '';
const mainEl = document.getElementById('main');
const titleEl = document.getElementById('pageTitle');
const backBtn = document.getElementById('backBtn');
const homeMeta = document.getElementById('homeMeta');
const homeNotice = document.getElementById('homeNotice');

function render() {
  const r = parseHash();
  if (r.page === 'home') {
    titleEl.textContent = '南城导航首页';
    backBtn.style.display = 'none';
    homeMeta.style.display = '';
    homeNotice.style.display = 'flex';
    renderHome();
  } else {
    const cat = CATS[r.idx];
    if (!cat) { location.hash = '#/'; return; }
    titleEl.textContent = cat.name;
    backBtn.style.display = 'flex';
    homeMeta.style.display = 'none';
    homeNotice.style.display = 'none';
    renderCat(cat);
  }
}

function renderHome() {
  const q = search.trim().toLowerCase();
  const cats = CATS.map((c, i) => ({...c, idx: i})).filter(c => !q || c.name.toLowerCase().includes(q));
  if (cats.length === 0) { mainEl.innerHTML = '<div class="empty">没有找到相关分类</div>'; return; }
  let html = '<div class="grid g2">';
  cats.forEach(c => {
    html += `
      <a class="card cat-card" href="#/cat/${c.idx}">
        <div class="icon">${iconSVG(c.iconIdx)}</div>
        <span class="label">${c.name}</span>
      </a>`;
  });
  html += '</div>';
  html += `
    <h2 class="section-title">快捷链接</h2>
    <div class="grid g3">
      <a class="card" href="https://example.com" target="_blank" rel="noopener">
        <div class="icon">${iconSVG(2)}</div>
        <span class="label">网盘</span>
      </a>
    </div>`;
  mainEl.innerHTML = html;
}

function renderCat(cat) {
  const q = search.trim().toLowerCase();
  const links = cat.links.filter(l => !q || (l.name + ' ' + (l.url||'')).toLowerCase().includes(q));
  if (links.length === 0) {
    mainEl.innerHTML = `<h2 class="section-title">${cat.name}</h2><div class="empty">没有找到相关链接</div>`;
    return;
  }
  let html = `<h2 class="section-title">${cat.name}</h2><div class="grid g3">`;
  links.forEach(l => {
    html += `
      <a class="card" href="${l.url || '#'}" target="_blank" rel="noopener">
        <div class="icon">${iconSVG(l.iconIdx)}</div>
        <span class="label">${l.name}</span>
      </a>`;
  });
  html += '</div>';
  mainEl.innerHTML = html;
}

window.addEventListener('hashchange', () => {
  search = '';
  document.getElementById('searchInput').value = '';
  render();
});

document.getElementById('searchInput').addEventListener('input', e => {
  const v = e.target.value.trim();
  if (v === '91') {
    location.href = 'https://91short.com';
    return;
  }
  search = e.target.value;
  render();
});

backBtn.addEventListener('click', () => { location.hash = '#/'; });

const toastEl = document.getElementById('toast');
let toastTimer;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
}

document.getElementById('shareBtn').addEventListener('click', async () => {
  const url = 'https://nanc.cc.cd';
  if (navigator.share) {
    try { await navigator.share({ title: '南城导航首页', url }); } catch (e) {}
  } else {
    try { await navigator.clipboard.writeText(url); toast('链接已复制：' + url); }
    catch (e) { toast('请手动复制：' + url); }
  }
});

render();

/* 延迟随机数，每秒刷新 */
(function() {
  const el = document.getElementById('latency');
  function tick() {
    const ms = Math.floor(Math.random() * (1500 - 20 + 1)) + 20;
    el.textContent = ms;
    if (ms < 300) el.style.color = '#22c55e';
    else if (ms <= 1000) el.style.color = '#e8a04b';
    else el.style.color = '#ef4444';
  }
  tick();
  setInterval(tick, 1000);
})();

/* 赞赏悬浮按钮可拖动 */
(function() {
  const fab = document.getElementById('donateFab');
  let dragging = false, startX, startY, origX, origY, moved = false;
  function getPos(e) { return e.touches ? e.touches[0] : e; }
  function onStart(e) {
    dragging = true; moved = false;
    const p = getPos(e);
    startX = p.clientX; startY = p.clientY;
    const rect = fab.getBoundingClientRect();
    origX = rect.left; origY = rect.top;
    fab.style.right = 'auto';
    fab.style.bottom = 'auto';
    fab.style.left = origX + 'px';
    fab.style.top = origY + 'px';
  }
  function onMove(e) {
    if (!dragging) return;
    const p = getPos(e);
    const dx = p.clientX - startX, dy = p.clientY - startY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
    let nx = origX + dx, ny = origY + dy;
    const fw = fab.offsetWidth, fh = fab.offsetHeight;
    nx = Math.max(0, Math.min(nx, window.innerWidth - fw));
    ny = Math.max(0, Math.min(ny, window.innerHeight - fh));
    fab.style.left = nx + 'px';
    fab.style.top = ny + 'px';
    if (e.cancelable) e.preventDefault();
  }
  function onEnd() { dragging = false; }
  fab.addEventListener('mousedown', onStart);
  fab.addEventListener('touchstart', onStart, {passive: true});
  window.addEventListener('mousemove', onMove);
  window.addEventListener('touchmove', onMove, {passive: false});
  window.addEventListener('mouseup', onEnd);
  window.addEventListener('touchend', onEnd);
  fab.addEventListener('click', () => {
    if (moved) return;
    document.getElementById('donateModal').classList.add('show');
  });
})();

document.getElementById('donateClose').addEventListener('click', () => {
  document.getElementById('donateModal').classList.remove('show');
});
document.getElementById('donateModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) e.currentTarget.classList.remove('show');
});
</script>

</body>
</html>
